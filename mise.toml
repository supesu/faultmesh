[tools]
go = "latest"
buf = "latest"
helm = "latest"
kind = "latest"
kubectl = "latest"
erlang = "27"
rebar = "3.23.0"

[env]
KIND_CLUSTER = "faultmesh"
IMAGE_TAG = "dev"
CMDS = "fm-agent fm-operator fm-executor fm-ctl"

[tasks.images]
description = "Build the four data-plane images plus the Erlang control-plane image"
dir = "{{config_root}}"
run = '''
for c in $CMDS; do
  docker build --build-arg CMD=$c -t faultmesh/$c:$IMAGE_TAG -f data-plane/Dockerfile data-plane || exit 1
done
docker build -t faultmesh/control-plane:$IMAGE_TAG -f control-plane/Dockerfile . || exit 1
'''

[tasks.cluster-up]
description = "Create the kind cluster if it doesn't exist"
run = '''
if ! kind get clusters | grep -qx "$KIND_CLUSTER"; then
  kind create cluster --name "$KIND_CLUSTER"
fi
'''

[tasks.load]
description = "Load images into the kind cluster"
depends = ["images", "cluster-up"]
run = '''
for c in $CMDS; do
  kind load docker-image faultmesh/$c:$IMAGE_TAG --name "$KIND_CLUSTER" || exit 1
done
kind load docker-image faultmesh/control-plane:$IMAGE_TAG --name "$KIND_CLUSTER" || exit 1
'''

[tasks.deps]
description = "Fetch Helm dependencies (SPIRE subchart + spire-crds release)"
dir = "{{config_root}}/data-plane/deploy/helm/faultmesh"
run = '''
helm repo add spiffe https://spiffe.github.io/helm-charts-hardened 2>/dev/null || true
helm repo update spiffe
helm dependency build .
kubectl create namespace spire-system 2>/dev/null || true
kubectl create namespace spire-server 2>/dev/null || true
helm upgrade --install spire-crds spiffe/spire-crds --namespace spire-system
'''

[tasks.install]
description = "Install/upgrade the faultmesh Helm chart"
dir = "{{config_root}}/data-plane"
depends = ["load", "deps"]
run = "helm upgrade --install fm deploy/helm/faultmesh --namespace faultmesh --create-namespace --wait"

[tasks.up]
description = "Full dev loop: build images, create cluster, load, install"
depends = ["install"]
run = "kubectl -n faultmesh get pods"

[tasks.down]
description = "Uninstall the chart and delete the kind cluster"
run = '''
helm -n faultmesh uninstall fm --ignore-not-found || true
kind delete cluster --name "$KIND_CLUSTER" || true
'''

[tasks.status]
description = "Show pod status in the faultmesh namespace"
run = "kubectl -n faultmesh get pods -o wide"

[tasks.logs-agent]
description = "Tail fm-agent logs"
run = "kubectl -n faultmesh logs -l app.kubernetes.io/component=agent --tail=50 -f"
